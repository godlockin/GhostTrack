[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghosttrack"
version = "2.2.0"
description = "OSINT lookup tool for IP addresses, phone numbers and usernames"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HunxByts" }]
keywords = ["osint", "ip-lookup", "phone-number", "username", "recon"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = [
    "requests>=2.32,<3",
    "phonenumbers>=8.13,<10",
]

[project.scripts]
ghosttrack = "ghosttrack.cli:main"

[tool.setuptools]
py-modules = ["GhostTR"]

[tool.setuptools.packages.find]
include = ["ghosttrack*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8",
]
